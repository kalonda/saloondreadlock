<!doctype html>
<html lang="sw" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DREADLOCKS AND HAIR DRESSING SALOON" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <title>DREADLOCKS AND HAIR DRESSING SALOON</title>
  </head>
  <body class="bg-[#0b0f19] text-slate-100 antialiased selection:bg-purple-600 selection:text-white min-h-screen">
    <div id="root">
      <div id="initial-splash" style="position: fixed; inset: 0; background: #090d16; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
        <div style="position: relative; width: 110px; height: 110px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -6px; border-radius: 50%; border: 3px solid transparent; border-top-color: #eab308; border-right-color: #a855f7; animation: splash-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;"></div>
          <img src="/app-logo.png" alt="Saloon Logo" style="width: 92px; height: 92px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 30px rgba(234, 179, 8, 0.4);" />
        </div>
        <div style="font-size: 15px; font-weight: 800; letter-spacing: 1.5px; color: #f8fafc; text-transform: uppercase; text-align: center; margin-bottom: 8px;">
          DREADLOCKS &amp; SALOON
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: #94a3b8;">
          <span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #eab308; animation: splash-pulse 1.4s infinite ease-in-out;"></span>
          <span>Inapakia mfumo wa saluni...</span>
        </div>
      </div>
      <style>
        @keyframes splash-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes splash-pulse {
          0%, 100% { transform: scale(0.7); opacity: 0.4; }
          50% { transform: scale(1.3); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
